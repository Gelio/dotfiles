# Tools and tasks for working on this repo. `mise run lint` runs the same
# checks locally and in CI. universal/mise/config is the separate, per-machine
# mise config that bootstrap links to ~/.config/mise.

[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
ruff = "0.17.4"
shellcheck = "0.11.0"
shfmt = "3.14.1"
stylua = "2.6.0"
# Not in the mise registry under this name. The macOS build is x86_64 only, so
# Apple Silicon needs Rosetta.
"aqua:Kampfkarren/selene" = "0.32.0"

[tasks.lint]
description = "Run every static check"
depends = [
  "lint:shellcheck",
  "lint:shfmt",
  "lint:zsh",
  "lint:actions",
  "lint:stylua",
  "lint:selene",
  "lint:ruff",
  "lint:secrets",
]

[tasks."lint:shellcheck"]
description = "ShellCheck bash and sh scripts"
run = "ci/lint-shellcheck.sh"

[tasks."lint:shfmt"]
description = "Check bash and sh formatting against .editorconfig"
run = "ci/lint-shfmt.sh"

[tasks."lint:zsh"]
description = "Parse zsh files with zsh -n"
run = "ci/lint-zsh.sh"

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks."lint:stylua"]
description = "Check Lua formatting against .editorconfig"
run = "ci/lint-stylua.sh"

[tasks."lint:selene"]
description = "Lint Lua files with Selene"
run = "ci/lint-selene.sh"

[tasks."lint:ruff"]
description = "Lint Python files and check their formatting"
run = "ci/lint-ruff.sh"

[tasks."lint:secrets"]
description = "Scan the whole git history for secrets"
run = "ci/lint-gitleaks.sh"
