# Tools and tasks for working on this repo. `mise run lint` runs the same
# checks locally and in CI. universal/mise/config is the separate, per-machine
# mise config that bootstrap links to ~/.config/mise.

[tools]
gitleaks = "8.30.1"
jactionlint = "2.5.0"
ruff = "0.17.4"
shellcheck = "0.11.0"
shfmt = "3.14.1"
stylua = "2.6.0"
# Not in the mise registry under this name. selene-0.32.0-macos.zip holds an
# arm64 binary, so it runs natively on Apple Silicon and fails on Intel Macs.
"aqua:Kampfkarren/selene" = "0.32.0"
# The standalone binary, so that formatting doesn't need Node.
"aqua:oxc-project/oxc/oxfmt" = "0.77.0"

[tasks.lint]
description = "Run every static check"
depends = [
  "lint:shellcheck",
  "lint:shfmt",
  "lint:zsh",
  "lint:actions",
  "lint:stylua",
  "lint:selene",
  "lint:ruff",
  "lint:format",
  "lint:secrets",
]

[tasks."hooks:install"]
description = "Run the lint checks before every git push from this clone"
run = "ci/install-hooks.sh"

[tasks."lint:shellcheck"]
description = "ShellCheck bash and sh scripts"
run = "ci/lint-shellcheck.sh"

[tasks."lint:shfmt"]
description = "Check bash and sh formatting against .editorconfig"
run = "ci/lint-shfmt.sh"

[tasks."lint:zsh"]
description = "Parse zsh files with zsh -n"
run = "ci/lint-zsh.sh"

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
# correctness: actionlint's checks plus bug detectors, without the default
# profile's security and policy rules
run = "jactionlint --profile correctness"

[tasks."lint:stylua"]
description = "Check Lua formatting against .editorconfig"
run = "ci/lint-stylua.sh"

[tasks."lint:selene"]
description = "Lint Lua files with Selene"
run = "ci/lint-selene.sh"

[tasks."lint:ruff"]
description = "Lint Python files and check their formatting"
run = "ci/lint-ruff.sh"

[tasks."lint:format"]
description = "Check Markdown, JSON and YAML formatting"
run = "ci/lint-format.sh"

[tasks."lint:secrets"]
description = "Scan the whole git history for secrets"
run = "ci/lint-gitleaks.sh"
