name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # lint:secrets scans the whole history
          fetch-depth: 0
          persist-credentials: false
      # zsh isn't on the runner by default, and lint:zsh fails in CI without it
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
      - run: mise run lint
