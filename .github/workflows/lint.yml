name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancels a pull request's older runs. Runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash, unlike the default shell, runs with pipefail
defaults:
  run:
    shell: bash

jobs:
  lint:
    # The same as the job ID, so that the check keeps its name
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # lint:secrets scans the whole history
          fetch-depth: 0
          persist-credentials: false
      # zsh isn't on the runner by default, and lint:zsh fails in CI without it
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.4
      - run: mise run lint
      - run: mise run test
