[tools]
usage = "latest"
# cargo: backend dependencies (git-absorb, git-stack, broot, ...)
rust = "stable"
cargo-binstall = "latest"
# npm: backend dependency, and the default node everywhere
node = "lts"
# pipx: backend installs through uv when it is available
uv = "latest"
jq = "latest"
yq = "latest"
fzf = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
eza = "latest"
sd = "latest"
zoxide = "latest"
starship = "latest"
atuin = "latest"
tmux = "latest"
gh = "latest"
# git.gitconfig sets `pager = delta`, so git breaks without it
delta = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]

[dotfile_groups.mise]
root = "mise/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.atuin]
root = "atuin/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.atuin.entries]
"~/.config/atuin" = { mode = "symlink" }

[dotfile_groups.bat]
root = "bat/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.eza]
root = "eza/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.starship]
root = "starship/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.zoxide]
root = "zoxide/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.tmux]
root = "tmux/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.git]
root = "git/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.git.entries]
"~/.config/lazygit" = { mode = "symlink" }
"~/.config/gitui" = { mode = "symlink" }

[dotfiles]
# ~/.gitconfig stays machine-local (identity, credentials), so mise only owns
# the include of the shared config
"~/.gitconfig/dotfiles-include" = { block = '''
[include]
  path = "~/.config/git.gitconfig"''' }

[dotfile_groups.rust]
root = "rust/home"
target = "~"
mode = "symlink-each"

# Terminal emulators are not installed by mise, but linking their config on a
# machine without them is harmless.
[dotfile_groups.ghostty]
root = "ghostty/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.ghostty.entries]
"~/.config/ghostty" = { mode = "symlink" }

[dotfile_groups.kitty]
root = "kitty/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.kitty.entries]
"~/.config/kitty" = { mode = "symlink" }

[dotfile_groups.wezterm]
root = "wezterm/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.wezterm.entries]
"~/.config/wezterm" = { mode = "symlink" }

[bootstrap.hooks]
# Also runs before `mise dot apply`. ~/.config/mise links to the repo's config
# directory, so the guard is found next to it.
pre-dotfiles = "python3 {{ config_root }}/.config/mise/../merge-guard.py"
