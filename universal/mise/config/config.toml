[tools]
usage = "latest"
# cargo: backend dependencies (git-absorb, git-stack, broot, ...)
rust = "stable"
cargo-binstall = "latest"
# npm: backend dependency, and the default node everywhere
node = "lts"
# pipx: backend installs through uv when it is available
uv = "latest"
jq = "latest"
yq = "latest"
fzf = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
eza = "latest"
sd = "latest"
zoxide = "latest"
starship = "latest"
atuin = "latest"
tmux = "latest"
gh = "latest"
# git.gitconfig sets `pager = delta`, so git breaks without it
delta = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]

[dotfile_groups.mise]
root = "mise/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.atuin]
root = "atuin/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.bat]
root = "bat/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.eza]
root = "eza/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.starship]
root = "starship/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.zoxide]
root = "zoxide/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.tmux]
root = "tmux/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.git]
root = "git/home"
target = "~"
mode = "symlink-each"

[dotfile_groups.rust]
root = "rust/home"
target = "~"
mode = "symlink-each"
